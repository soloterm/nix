name: Update nixpkgs

# Solo links against nixpkgs' WebKitGTK, so keep the pinned nixpkgs current for
# security fixes. The bump lands only if the package still builds and launches.
on:
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: track-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update flake.lock
        id: lock
        run: |
          nix flake update
          if [[ -n $(git status --porcelain flake.lock) ]]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Verify against the new nixpkgs
        if: steps.lock.outputs.changed
        uses: ./.github/actions/verify

      - name: Commit flake.lock
        if: steps.lock.outputs.changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake.lock: update nixpkgs"
          git push origin HEAD:main
